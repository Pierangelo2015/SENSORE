
<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>INDRET TELECOMANDO </title>
<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script src="https://unpkg.com/mqtt/dist/mqtt.v4.js"></script>
<!-- <script src="mqtt-v4.js" type="text/javascript"></script> -->
    <style>
	        /* Contenitore per affiancare i pulsanti */
       .container-pulsanti { display: flex; gap: 10px; width: 100%; max-width: 400px; margin: 5px auto; 0  }

        body { font-family: Arial, sans-serif; text-align: center; margin-top: 20px; background: #f0f0f0; padding: 10px; }
        .pannello { max-width: 920px; margin: 0 auto; background: white; padding: 10px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); box-sizing: border-box; }
        h2 { color: #333; margin-bottom: 20px; }
        
        /* Stili coordinati del consorzio */
        .btn-cmd { width: 40%; max-width: 150px; padding: 12px; margin: 10px 0; font-size: 20px; font-weight: bold; color: white; border: none; border-radius: 10px; cursor: pointer; display: inline-block; box-shadow: 0 3px 6px rgba(0,0,0,0.1); }
        .btn-apri { background-color:   #5cb85c; }
        .btn-chiudi { background-color: #d9534f; }
        .btn-auto { background-color: #7275d8; }
        .btn-comando { background-color: #774455;  }
        
        .input-manuale { padding: 12px; font-size: 18px; text-align: center; border-radius: 5px; border: 2px solid #774455; width: 75%; max-width: 380px; margin-top: 15px; box-sizing: border-box; }
        
        .btn-link { display: block; width: 65%; max-width: 300px; padding: 15px; margin: 15px auto 0 auto; font-size: 18px; font-weight: bold; color: white; background-color: #0275d8; text-decoration: none; border-radius: 10px; box-shadow: 0 3px 6px rgba(0,0,0,0.1); }
    </style>
</head>
<body>

<div class="pannello">
    <h4>INDRET COMANDI a:<span id="nome_device" display: inline; style="color: purple;" margin-bottom: 0px; margin-top: 0px; >...</span></h4>
    
    <!-- Area di visualizzazione dello stato realtime della valvola -->
    <div id="stato_connessione" style="font-size:20px; font-weight:bold; color:blue; margin-bottom:5px;">CONNESSIONE IN CORSO...</div>
    <span style="font-weight: bold; color: #333;">TX:</span>
    <div id="stato_reale"   style="display: inline-block; font-size:20px; color:#666; margin-bottom:10px;">Nessun dato trasmesso</div>
    <br>
	<span style="font-weight: bold; color: #333;">RX:</span>
    <div id="stato_ricevuto"  style="display: inline-block; font-size:20px; color:#666; margin-bottom:10px;">Nessun dato ricevuto</div>

<div class="container-pulsanti">
    <button onclick="publishMessageV4('irriguo/donnas/pi3_2/comando', 'APRI')" class="btn-cmd btn-apri">APRI</button>
    <button onclick="publishMessageV4('irriguo/donnas/pi3_2/comando', 'CHIUDI')" class="btn-cmd btn-chiudi">CHIUDI</button>
</div>
<div class="container-pulsanti">
     <button onclick="publishMessageV4('irriguo/donnas/pi3_2/comando', 'AUTO')" class="btn-cmd btn-auto">AUTO</button>
     <button onclick="publishMessageV4('irriguo/donnas/pi3_2/comando', 'STAT')" class="btn-cmd btn-auto">STAT</button>
</div>
     <div style="display: flex; flex-direction: column; align-items: center; gap: 5px;">
<div class="container-pulsanti">
     <input type="text" id="testo_comando_libero" class="input-manuale"  width: 78%; placeholder="Scrivi comando manuale...",required><br>
     <button onclick="inviaComandoManualeLetto()" class="btn-cmd btn-comando" style="margin-top: 10px;font-size: 14px; width: 18%;">INVIA</button>
</div>
<div class="container-pulsanti">
        <a href="https://irriguoindret.free.je" class="btn-link">📊 HOME</a>
	    <a href="https://irriguoindret.free.je/view.html" class="btn-link">📊 STATO </a>
</div>
		</div>

    <p style="font-style: italic; color: #666; margin-top: 20px; font-size: 12px;">
        "L'acqua è un bene prezioso, non sprecarla."
    </p>
</div>


<script>

var clientId = 'WEB_to_PI3_2';
const hostname = 'crystalmq.bevywise.com';
const username = 'xgW9jpWlxSieGetEDZ';
const password = 'Y4H3Mb2qCPTSE0cuAv';
var topicDestinazione = "irriguo/donnas/pi3_2/comando"; 
var topicAscolto = "irriguo/donnas/pi3_2/stato"; 

var urlParams = new URLSearchParams(window.location.search);
var deviceDallUrl = urlParams.get('device');
var userDallUrl = urlParams.get('user');
if (deviceDallUrl)  // legge da ?device=1 il raspberrry da connettere
  {
   localStorage.setItem('consorzio_device_attivo', deviceDallUrl.toLowerCase().trim());
  }
if (userDallUrl)  // legge da ?device=1 il raspberrry da connettere
  {
   localStorage.setItem('consorzio_user_attivo', userDallUrl.toLowerCase().trim());
  }

var deviceCorrente = localStorage.getItem('consorzio_device_attivo') || 'pi3_2';
var userCorrente = localStorage.getItem('consorzio_user_attivo') || 'peter';
var indicatore = document.getElementById('nome_device');
if  (deviceCorrente =="1" || deviceCorrente =="pi3_1")
  { 
   clientId = userCorrente+'_1';
   topicDestinazione = "irriguo/donnas/pi3_1/comando"; 
   topicAscolto = "irriguo/donnas/pi3_1/stato"; 
   document.getElementById('nome_device').innerHTML = "ARTADA" ; 
  }
if  (deviceCorrente =="2" || deviceCorrente =="pi3_2")
  {
   clientId = userCorrente+'_2';
   topicDestinazione = "irriguo/donnas/pi3_2/comando"; 
   topicAscolto = "irriguo/donnas/pi3_2/stato";  
   document.getElementById('nome_device').innerHTML = "SCRIVANIA" ; 
  }

indicatore.style.color = "red";
 	
  //Connect with Authentication:

const mqttV4Options = {
            clientId: clientId,
            hostname: hostname,
            port: 10443,
            protocol: 'ws', // MQTT protocol
            username: username, // Add username if needed
            password: password, // Add password if needed
	
  // CONTROLLO TIMEOUT & PROTOCOLLO
    keepAliveInterval: 30,        // In Paho si chiama cos� (impostato a 30s per evitare i blocchi di rete)
    timeout: 5,                   // Timeout di connessione espresso in secondi (pari ai tuoi 5000ms)
    cleanSession: true,           // Nello standard Paho si usa cleanSession

    // ABILITA LA RICONNESSIONE AUTOMATICA IN PAHO
    reconnect: true,              // Dice a Paho di riconnettersi se cade la linea (Risolve il problema del ricaricamento pagina)

	
			
    // Opzioni di controllo complete per la versione 4 della libreria
   // clean: true,               // Nello standard mqtt.js v4 si scrive "clean" e non "cleanSession"
   // keepalive: 60,             // Nello standard mqtt.js v4 si scrive tutto in minuscolo
   //connectTimeout: 5000,      // Espresso in millisecondi (5 secondi)
   // reconnectPeriod: 0,        // Blocca la creazione di client cloni se perde la linea

    // IMPONE IL PROTOCOLLO MQTT v5
    mqttVersion: 5         // Nello standard mqtt.js v4 si usa "protocolVersion" e non "mqttVersion"

};

const mqttV4Client = mqtt.connect(`ws://${mqttV4Options.hostname}:${mqttV4Options.port}`, mqttV4Options);
document.getElementById('stato_connessione').innerHTML = "connesso" +" a "+ clientId; 

// publish

window.publishMessageV4 = function (topic, message) {
    var indicatore = document.getElementById('stato_reale');
    var indicatore2 = document.getElementById('stato_ricevuto');
    mqttV4Client.publish(topic, message, { qos: 1 }, (err) => {
        if (!err) {
            console.log(`Published message on MQTT v4: ${topic} - ${message}`);
			document.getElementById('stato_reale').innerHTML = message ; 
    	    indicatore.style.color = "red";
 	        document.getElementById('stato_ricevuto').innerHTML = "Attesa Risposta" ; 
    	    indicatore2.style.color = "black";
 	    
        } else {
            console.error(`Failed to publish message on MQTT v4: ${err}`);
        }
    });
};


window.inviaComandoManualeLetto = function ( ) 
    {
     
    var campo = document.getElementById('testo_comando_libero');
    var comandoEstratto = campo.value.trim();
    if (comandoEstratto === "") {
        alert("Digita un comando prima di premere invio!");
        return;
    }
	publishMessageV4(topicDestinazione, comandoEstratto) ;
   }
// subscribe

window.subscribeToTopicV4 = function (topic) 
{
   mqttV4Client.subscribe(topic, (err) => {
        if (!err) {
            console.log(`Subscribed to MQTT v4 topic: ${topic}`);
        } else {
            console.error(`Failed to subscribe to MQTT v4 topic: ${err}`);
        }
    });
};



// disconnect
window.disconnectClientV4 = function () {
    mqttV4Client.end(true, () => {
        console.log('Disconnected MQTT v4 client.');
		document.getElementById('stato_connessione').innerHTML = "STATUS=" + "sconnesso"; 
		    });
};

// message receive
mqttV4Client.on('message', (topic, message) =>
 {  
    var indicatore = document.getElementById('stato_ricevuto');
    document.getElementById('stato_ricevuto').innerHTML = message;  
    indicatore.style.color = "green";
 
    console.log(`Received message on MQTT v4: ${topic} - ${message.toString()}`);
	
 });

// disconnect call background
mqttV4Client.on('reconnect', () => {
    var indicatore = document.getElementById('stato_connessione');
    document.getElementById('stato_connessione').innerHTML = "connesso" +" a "+ clientId; 
    console.log('Disconnected from MQTT v4 Broker.');
});

mqttV4Client.on('close', () => {
    var indicatore = document.getElementById('stato_connessione');
    document.getElementById('stato_connessione').innerHTML = "sconnesso";  
  
    console.log('Disconnected from MQTT v4 Broker.');
});

subscribeToTopicV4(topicAscolto);	

</script>
</body>
</html>
