<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Telecomando Indret</title>
    <!-- Libreria ufficiale Paho MQTT corretta -->
    <script src="https://cloudflare.com" type="text/javascript"></script>
</head>
<body style="font-family:Arial,sans-serif; text-align:center; margin-top:50px; background:#f0f0f0;">

    <h2>INDRET - TELECOMANDO VASCA</h2>
    
    <!-- Scritta di stato per le colleghe -->
    <div id="stato" style="font-size:24px; font-weight:bold; color:blue; margin-bottom:40px;">PRONTO</div>

    <!-- Contenitore per i due pulsanti giganti -->
    <div style="display: flex; flex-direction: column; align-items: center; gap: 20px;">
        
        <!-- Pulsante APRI -->
        <button onclick="inviaComando('APRI')" style="width:85%; max-width:400px; padding:30px; font-size:35px; font-weight:bold; color:white; background:#d9534f; border:none; border-radius:10px; cursor:pointer;">
            APRI VALVOLA
        </button>

        <!-- Pulsante CHIUDI -->
        <button onclick="inviaComando('CHIUDI')" style="width:85%; max-width:400px; padding:30px; font-size:35px; font-weight:bold; color:white; background:#5cb85c; border:none; border-radius:10px; cursor:pointer;">
            CHIUDI VALVOLA
        </button>
        
    </div>

<script>
    function inviaComando(azione) {
        var d = document.getElementById('stato');
        d.innerText = "Connessione...";
        d.style.color = "orange";

        // ID casuale per evitare disconnessioni se usato contemporaneamente
        var id = 'Cell_' + Math.floor(Math.random() * 10000);
        
        // CORREZIONE: Utilizzo della sintassi esatta 'Paho.Client' allineata alla libreria
        var client = new Paho.Client('81ae066616fc412a982bd3f894410810.s1.eu.hivemq.cloud', 8884, '', id);

        client.connect({
            userName: 'IRRIGUOINDRET',
            password: 'Irriguo_2026',
            useSSL: true,
            timeout: 5,
            onSuccess: function () {
                d.innerText = "Invio: " + azione + "...";
                
                // Invia l'azione specifica (APRI o CHIUDI) al topic
                var m = new Paho.Message(azione);
                m.destinationName = "irriguo/donnas/pi3_1/comando";
                m.qos = 1;
                
                client.send(m);
                
                // Conferma visiva sul display dello smartphone
                d.innerText = "COMANDO " + azione + " INVIATO!";
                d.style.color = "green";
                
                // Sconnessione rapida per liberare lo slot sul broker
                setTimeout(function() { client.disconnect(); }, 300);
            },
            onFailure: function (e) {
                d.innerText = "Errore: " + e.errorMessage;
                d.style.color = "red";
            }
        });
    }
</script>

</body>
</html>
