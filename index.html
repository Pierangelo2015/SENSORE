<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Telecomando Indret</title>
    <!-- Carica il motore MQTT standard (1 sola riga, impossibile da tagliare) -->
    <script src="https://cloudflare.com"></script>
</head>
<body style="font-family:Arial,sans-serif; text-align:center; margin-top:50px; background:#f0f0f0;">

    <h2>INDRET - TELECOMANDO VASCA</h2>
    
    <!-- Scritta di stato per le colleghe -->
    <div id="stato" style="font-size:24px; font-weight:bold; color:blue; margin-bottom:40px;">PRONTO</div>

    <!-- Pulsante gigante facilissimo da premere da smartphone -->
    <button onclick="manda()" style="width:85%; max-width:400px; padding:30px; font-size:35px; font-weight:bold; color:white; background:#d9534f; border:none; border-radius:10px; cursor:pointer;">
        APRI VALVOLA
    </button>

<script>
    function manda() {
        var d = document.getElementById('stato');
        d.innerText = "Connessione...";
        d.style.color = "orange";

        // ID casuale per non far disconnettere le colleghe se premono insieme
        var id = 'Cell_' + Math.floor(Math.random() * 10000);
        
        // Configurazione diretta sul tuo host HiveMQ Cloud (Porta sicura 443)
        var client = new Paho.Client('81ae066616fc412a982bd3f894410810.s1.eu.hivemq.cloud', 443, '/mqtt', id);

        client.connect({
            userName: 'IRRIGUOINDRET',
            password: 'Irriguo_2026',
            useSSL: true,
            timeout: 5,
            onSuccess: function () {
                d.innerText = "Invio...";
                
                // Il tuo comando fisso (modificabile in futuro)
                var m = new Paho.Message("APRI");
                m.destinationName = "irriguo/donnas/pi3_1/comando";
                m.qos = 1;
                
                client.send(m);
                
                // Conferma visiva immediata sul telefono
                d.innerText = "COMANDO INVIATO!";
                d.style.color = "green";
                
                // Chiude subito il canale per risparmiare banda
                setTimeout(function() { client.disconnect(); }, 300);
            },
            onFailure: function (e) {
                d.innerText = "Errore: " + e.errorMessage;
                d.style.color = "red";
            }
        });
    }
</script>

</body>
</html>
